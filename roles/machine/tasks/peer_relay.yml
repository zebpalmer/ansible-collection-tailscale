---
# Configures Tailscale peer-relay server settings and (optionally) the
# public-IP watcher that keeps the relay's static endpoint in sync with a
# NAT/port-forward setup. Imported from main.yml unconditionally; every task
# is gated on a peer-relay flag so this is a no-op on non-relay nodes.
#
# Relay settings are applied here via `tailscale set` rather than in the
# `tailscale up` args, because --relay-server-port and
# --relay-server-static-endpoints are `tailscale set` flags. Passing them to
# `tailscale up` makes it abort with an unknown-flag error.

# --- Relay server port / static endpoints (tailscale set) ---

- name: Read current Tailscale prefs (peer relay)
  ansible.builtin.command: tailscale debug prefs
  register: _tailscale_relay_prefs
  changed_when: false
  when: not ansible_check_mode

- name: Set peer-relay server port
  ansible.builtin.command: tailscale set --relay-server-port={{ tailscale_peer_relay_port }}
  changed_when: true
  when:
    - tailscale_peer_relay | bool
    - not ansible_check_mode
    - (_tailscale_relay_prefs.stdout | from_json).RelayServerPort | default(0) | int != tailscale_peer_relay_port | int

- name: Set peer-relay static endpoints (only when watcher is not managing them)
  ansible.builtin.command: >-
    tailscale set
    --relay-server-static-endpoints={{ tailscale_peer_relay_static_endpoints | join(',') }}
  changed_when: true
  when:
    - tailscale_peer_relay | bool
    - not (tailscale_peer_relay_watcher | bool)
    - tailscale_peer_relay_static_endpoints | length > 0
    - not ansible_check_mode
    - ((_tailscale_relay_prefs.stdout | from_json).RelayServerStaticEndpoints | default([]) | sort) != (tailscale_peer_relay_static_endpoints | sort)

- name: Disable peer-relay server port when peer relay is turned off
  ansible.builtin.command: tailscale set --relay-server-port=
  changed_when: true
  when:
    - not (tailscale_peer_relay | bool)
    - not ansible_check_mode
    - (_tailscale_relay_prefs.stdout | from_json).RelayServerPort | default(0) | int != 0

# --- Public-IP watcher (opt-in via tailscale_peer_relay_watcher) ---

- name: Install peer-relay endpoint update script
  ansible.builtin.template:
    src: tailscale-relay-endpoint-update.sh.j2
    dest: /usr/local/sbin/tailscale-relay-endpoint-update
    owner: root
    group: root
    mode: "0755"
  when: tailscale_peer_relay_watcher | bool

- name: Install peer-relay endpoint systemd service
  ansible.builtin.template:
    src: tailscale-relay-endpoint.service.j2
    dest: /etc/systemd/system/tailscale-relay-endpoint.service
    owner: root
    group: root
    mode: "0644"
  when: tailscale_peer_relay_watcher | bool
  register: _tailscale_relay_service

- name: Install peer-relay endpoint systemd timer
  ansible.builtin.template:
    src: tailscale-relay-endpoint.timer.j2
    dest: /etc/systemd/system/tailscale-relay-endpoint.timer
    owner: root
    group: root
    mode: "0644"
  when: tailscale_peer_relay_watcher | bool
  register: _tailscale_relay_timer

- name: Reload systemd after unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - tailscale_peer_relay_watcher | bool
    - _tailscale_relay_service.changed or _tailscale_relay_timer.changed

- name: Enable and start peer-relay endpoint timer
  ansible.builtin.systemd:
    name: tailscale-relay-endpoint.timer
    state: started
    enabled: true
  when: tailscale_peer_relay_watcher | bool

# A `tailscale up` earlier in the role resets any pref not named in its args,
# including the relay static endpoint. Run the watcher once now to restore it
# immediately rather than waiting for the next timer tick. Best-effort: the
# timer is the authoritative driver and will retry on its own schedule.
- name: Refresh peer-relay static endpoint now
  ansible.builtin.command: /usr/local/sbin/tailscale-relay-endpoint-update
  changed_when: false
  failed_when: false
  when:
    - tailscale_peer_relay_watcher | bool
    - not ansible_check_mode

- name: Stop and disable peer-relay endpoint timer when watcher disabled
  ansible.builtin.systemd:
    name: tailscale-relay-endpoint.timer
    state: stopped
    enabled: false
  when: not (tailscale_peer_relay_watcher | bool)
  failed_when: false

- name: Remove peer-relay endpoint files when watcher disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/tailscale-relay-endpoint-update
    - /etc/systemd/system/tailscale-relay-endpoint.service
    - /etc/systemd/system/tailscale-relay-endpoint.timer
    - /var/lib/tailscale-relay-endpoint.state # legacy: pre-self-healing watcher state
  when: not (tailscale_peer_relay_watcher | bool)
  register: _tailscale_relay_removed

- name: Reload systemd after removing units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (tailscale_peer_relay_watcher | bool)
    - _tailscale_relay_removed.changed
