---
# Runs `tailscale up` only when configuration has changed or the node is not
# connected. Idempotency is achieved by hashing tailscale_args + tags and
# comparing against a stored state file. The auth key is intentionally excluded
# from the hash so rotating the OAuth secret does not trigger a re-up.
#
# Two distinct paths depending on connection state:
#
#   NOT connected — full OAuth auth flow:
#     1. POST /api/v2/oauth/token  — exchange client_id + client_secret for a
#        short-lived access token.
#     2. POST /api/v2/tailnet/-/keys — use the access token to generate a
#        one-time auth key (expires 300s, single-use).
#     3. systemd-run tailscale up --authkey — detached from the SSH session so
#        a Tailscale restart mid-play does not kill the process.
#
#   Already connected, config changed — update in-place without re-auth:
#     tailscale up (no --authkey) — updates args and tags on the existing
#     device identity. No new device is created, no duplicate in the admin UI.
#
# Because `tailscale up` is detached via `systemd-run --no-block` (so a daemon
# restart cannot sever the SSH session it rides over), its exit status is not
# directly visible to Ansible — `tailscale status` returning 0 only proves the
# node is still connected on its OLD config, not that the new config applied.
# To avoid masking a failed up (e.g. a rejected flag), the wrapper records
# `tailscale up`'s real exit code to /run/tailscale-ansible-up.rc. The
# verification step reads it and fails the play on a non-zero result, and the
# config-hash state file is written only after that check passes — so a failed
# up is never recorded as converged and the next run retries.

- name: Compute configuration hash
  ansible.builtin.set_fact:
    _tailscale_config_hash: >-
      {{ ((tailscale_args | trim) ~ '|' ~ (_tailscale_effective_tags | sort | join(',')))
         | hash('sha256') }}

- name: Read stored configuration hash
  ansible.builtin.slurp:
    src: /var/lib/tailscale-ansible.state
  register: _tailscale_state
  failed_when: false

- name: Check Tailscale connection status
  ansible.builtin.command: tailscale status --peers=false
  register: _tailscale_status
  changed_when: false
  failed_when: false

- name: Determine if Tailscale up is needed
  ansible.builtin.set_fact:
    _tailscale_needs_up: >-
      {{ _tailscale_state.failed or
         (_tailscale_state.content | default('') | b64decode | trim) != _tailscale_config_hash or
         _tailscale_status.rc != 0 }}

- name: Ensure OAuth credentials are set
  ansible.builtin.assert:
    that:
      - tailscale_oauth_client_id | length > 0
      - tailscale_authkey | length > 0
    fail_msg: >-
      tailscale_oauth_client_id and/or tailscale_authkey are not set.
      Add the OAuth client ID to your group_vars and vault-encrypt the
      OAuth client secret as tailscale_authkey.

# Clear any result file from a previous run so the verification below cannot
# read a stale exit code.
- name: Remove stale tailscale up result file
  ansible.builtin.file:
    path: /run/tailscale-ansible-up.rc
    state: absent
  when:
    - _tailscale_needs_up | bool
    - not ansible_check_mode

# --- Path A: node is not connected — full OAuth auth flow ---

- name: Authenticate and bring up Tailscale (not connected)
  when: _tailscale_needs_up | bool and _tailscale_status.rc != 0
  block:
    # Delegated to localhost so the long-lived OAuth client secret never
    # leaves the controller. Only the short-lived single-use authkey created
    # below ships to the target.
    - name: Exchange OAuth credentials for access token
      ansible.builtin.uri:
        url: "https://api.tailscale.com/api/v2/oauth/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ tailscale_oauth_client_id }}"
          client_secret: "{{ tailscale_authkey }}"
        status_code: 200
      register: _tailscale_token_response
      delegate_to: localhost
      become: false
      no_log: "{{ not tailscale_insecurely_log_authkey }}"

    - name: Create one-time auth key via Tailscale API
      ansible.builtin.uri:
        url: "https://api.tailscale.com/api/v2/tailnet/-/keys"
        method: POST
        headers:
          Authorization: "Bearer {{ _tailscale_token_response.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          capabilities:
            devices:
              create:
                reusable: false
                ephemeral: "{{ tailscale_oauth_ephemeral | bool }}"
                preauthorized: "{{ tailscale_oauth_preauthorized | bool }}"
                tags: "{{ _tailscale_effective_tags | map('regex_replace', '^', 'tag:') | list }}"
          expirySeconds: 300
        status_code: 200
      register: _tailscale_auth_response
      delegate_to: localhost
      become: false
      no_log: "{{ not tailscale_insecurely_log_authkey }}"

    # The bash wrapper records `tailscale up`'s exit code so the detached run's
    # success/failure can be verified after the SSH session reconnects.
    - name: Bring up Tailscale with auth key
      ansible.builtin.command: >-
        systemd-run --no-block --
        /bin/bash -c
        'tailscale up
        --authkey={{ _tailscale_auth_response.json.key }}
        --advertise-tags={{ _tailscale_effective_tags | map('regex_replace', '^', 'tag:') | join(',') }}
        {{ tailscale_args | trim }}
        --timeout={{ tailscale_up_timeout }}s
        ; echo $? > /run/tailscale-ansible-up.rc'
      no_log: "{{ not tailscale_insecurely_log_authkey }}"
      changed_when: true

    - name: Wait for Tailscale to reconnect
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: "{{ tailscale_up_timeout | int + 30 }}"

# --- Path B: already connected, config changed — update in-place ---

- name: Update Tailscale configuration (already connected)
  when: _tailscale_needs_up | bool and _tailscale_status.rc == 0
  block:
    - name: Apply updated Tailscale configuration
      ansible.builtin.command: >-
        systemd-run --no-block --
        /bin/bash -c
        'tailscale up
        --advertise-tags={{ _tailscale_effective_tags | map('regex_replace', '^', 'tag:') | join(',') }}
        {{ tailscale_args | trim }}
        --timeout={{ tailscale_up_timeout }}s
        ; echo $? > /run/tailscale-ansible-up.rc'
      changed_when: true

    - name: Wait for Tailscale to reconnect
      ansible.builtin.wait_for_connection:
        delay: 3
        timeout: 60

# --- Verify the detached `tailscale up` actually succeeded ---

- name: Wait for the tailscale up result to be recorded
  ansible.builtin.wait_for:
    path: /run/tailscale-ansible-up.rc
    timeout: "{{ tailscale_up_timeout | int + 30 }}"
  when:
    - _tailscale_needs_up | bool
    - not ansible_check_mode

- name: Read tailscale up result
  ansible.builtin.slurp:
    src: /run/tailscale-ansible-up.rc
  register: _tailscale_up_rc
  when:
    - _tailscale_needs_up | bool
    - not ansible_check_mode

- name: Fail if tailscale up did not succeed
  ansible.builtin.assert:
    that:
      - (_tailscale_up_rc.content | b64decode | trim) == "0"
    fail_msg: >-
      `tailscale up` exited with status
      '{{ _tailscale_up_rc.content | b64decode | trim }}' on {{ inventory_hostname }}.
      The requested configuration was NOT applied — most often a rejected flag
      or an ACL/tag authorization problem. Inspect the transient unit's output
      with `journalctl -u "run-*"` (or `journalctl -u tailscaled`) on the host.
      The config-hash state file is left unwritten, so the next run will retry.
    success_msg: "tailscale up applied successfully."
  when:
    - _tailscale_needs_up | bool
    - not ansible_check_mode

# Written only after the up is confirmed successful — a failed up halts the play
# at the assert above, leaving the hash absent so the next run retries.
- name: Write configuration hash to state file
  ansible.builtin.copy:
    content: "{{ _tailscale_config_hash }}"
    dest: /var/lib/tailscale-ansible.state
    owner: root
    group: root
    mode: "0600"
  when:
    - _tailscale_needs_up | bool
    - not ansible_check_mode
